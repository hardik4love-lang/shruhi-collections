<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E8B2" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F3D683" />
    </linearGradient>
    <radialGradient id="crimsonCore" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3D0C1B" />
      <stop offset="70%" stop-color="#1E050D" />
      <stop offset="100%" stop-color="#0E0307" />
    </radialGradient>
  </defs>

  <!-- Outer Royal Octagonal Lotus Star -->
  <g transform="translate(120,120)">
    <polygon points="0,-112 32,-82 80,-80 82,-32 112,0 82,32 80,80 32,82 0,112 -32,82 -80,80 -82,32 -112,0 -82,-32 -80,-80 -32,-82"
             fill="url(#crimsonCore)" stroke="url(#goldGrad)" stroke-width="3.5" />
    <polygon points="0,-104 29,-76 74,-74 76,-29 104,0 76,29 74,74 29,76 0,104 -29,76 -74,74 -76,29 -104,0 -76,-29 -74,-74 -29,-76"
             fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.85" />
  </g>

  <!-- Concentric Zardozi Filigree Medallion Rings -->
  <circle cx="120" cy="120" r="84" fill="url(#crimsonCore)" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="120" cy="120" r="76" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="2,4" />
  <circle cx="120" cy="120" r="69" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />

  <!-- Top Royal Lotus Crown Finial -->
  <path d="M120 42 C112 54, 103 58, 106 66 C112 67, 117 64, 120 58 C123 64, 128 67, 134 66 C137 58, 128 54, 120 42 Z"
        fill="url(#goldGrad)" />
  <circle cx="120" cy="37" r="3.2" fill="url(#goldGrad)" />

  <!-- Bottom Heritage Diamond Flourish -->
  <polygon points="120,198 126,190 120,182 114,190" fill="url(#goldGrad)" />
  <line x1="94" y1="190" x2="110" y2="190" stroke="url(#goldGrad)" stroke-width="1.5" />
  <line x1="130" y1="190" x2="146" y2="190" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Bespoke Intertwined Serif Monogram 'SC' -->
  <text x="107" y="143" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold" fill="url(#goldGrad)" letter-spacing="-2">S</text>
  <text x="139" y="143" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="bold" fill="url(#goldGrad)" opacity="0.92">C</text>

  <!-- Micro Est. Label -->
  <text x="120" y="171" text-anchor="middle" font-family="Georgia, serif" font-size="9.5" font-weight="bold" fill="#F5D98E" letter-spacing="3.5">COUTURE</text>
</svg>
