name: Shruhi Collections 24/7 Facebook + WhatsApp Auto-AI Cloud Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  facebook-whatsapp-24x7-bot:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Shruhi Collections Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies (WhatsApp Baileys + Facebook Bot)
        run: npm install --production

      - name: Run 24/7 Facebook 3-Page + 100-Group Comment Auto-Reply & WhatsApp (+91 63552 85433) Funnel Sweep
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '61586357894191' }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8961434797:AAHaPPybfby3G-Mj7WeJEXsAtKPna-uSPnw' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8737013099' }}
          WHATSAPP_NUMBER: "916355285433"
          NODE_ENV: production
        run: |
          echo "========================================================"
          echo "☁️  SHRUHI COLLECTIONS — 24/7 CLOUD BOT SWEEP (GitHub Actions)"
          echo "   Facebook: 3 Pages + 100 Groups • WhatsApp: +91 63552 85433"
          echo "========================================================"
          node facebook-automation/fb-cloud-comment-worker.js

      - name: Commit Heartbeat Update (if changed)
        run: |
          git config --global user.email "bot@shruhicollections.in"
          git config --global user.name "Shruhi Collections 24/7 Bot"
          git add facebook-automation/cloud-24x7-heartbeat.json || true
          git diff --cached --quiet || git commit -m "⚡ 24/7 Cloud Sweep Heartbeat: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push || true
