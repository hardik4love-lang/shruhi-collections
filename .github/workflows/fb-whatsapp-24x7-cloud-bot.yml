name: Shruhi Collections 24/7 Facebook + WhatsApp Auto-AI Cloud Bot

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: shruhi-24x7-cloud-bot
  cancel-in-progress: false

jobs:
  facebook-whatsapp-24x7-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: facebook
    steps:
      - name: Checkout Shruhi Collections Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies (Dual WhatsApp Baileys + Facebook 24/7 Bot)
        run: npm install --production

      - name: Run Continuous 24/7 Live Cloud Daemon (Dual WhatsApp +91 90542 41725 & +91 63552 85433 + Facebook 3-Page Bot)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '61586357894191' }}
          FB_PAGE_ID_2: "61586323275145"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8961434797:AAHaPPybfby3G-Mj7WeJEXsAtKPna-uSPnw' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8737013099' }}
          WHATSAPP_NUMBER: "916355285433"
          WHATSAPP_NUMBER_2: "919054241725"
          WHATSAPP_MENS_NUMBER: "918849601725"
          NODE_ENV: production
        run: |
          echo "========================================================================"
          echo "☁️  SHRUHI COLLECTIONS — CONTINUOUS 24/7 LIVE CLOUD DAEMON (GITHUB)"
          echo "   WhatsApp    : STOPPED / DISABLED BY USER"
          echo "   Facebook    : Auto-Update Profile & 3 Pages + 100 Groups + 24/7 Reply (every 45s)"
          echo "========================================================================"
          node facebook-automation/fb-cloud-comment-worker.js || true
