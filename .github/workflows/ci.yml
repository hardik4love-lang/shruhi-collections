name: Shruhi Collections Storefront CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-validate:
    name: Lint, Validate & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi

      - name: Validate Server & Core Scripts Syntax
        run: |
          node -c server.js
          node -c app.js
          node -c catalog-data.js
          echo "All JavaScript source files passed syntax compilation."

      - name: Validate JSON Configuration Files
        run: |
          node -e "
            const fs = require('fs');
            const files = ['manifest.webmanifest', 'catalog-schema-graph.json', 'seo-keyword-clusters.json', 'restock-advisory.json'];
            for (const f of files) {
              try {
                JSON.parse(fs.readFileSync(f, 'utf8'));
                console.log('✓ Valid JSON:', f);
              } catch (err) {
                console.error('✗ Invalid JSON in file:', f, err.message);
                process.exit(1);
              }
            }
          "

      - name: Smoke Test Static HTTP Server
        run: |
          PORT=8099 node server.js &
          SERVER_PID=$!
          sleep 2
          curl -f http://localhost:8099/health || (kill $SERVER_PID && exit 1)
          curl -f http://localhost:8099/api/catalog || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID
          echo "Static HTTP server health & catalog endpoints verified successfully."
