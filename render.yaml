services:
  - type: web
    name: shruhi-collections-flagship-store
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8096
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_PRIMARY
        sync: false
      - key: WHATSAPP_MENS
        sync: false
